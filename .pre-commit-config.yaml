repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # 语料 content_sha256 指纹与 lockfile 完整性哈希为公开内容寻址
        # 标识，非秘密（ragmix 发布审计逐条核对后排除）
        exclude: '(^|/)(data/|frontend/pnpm-lock[.]yaml$|[.]secrets[.]baseline$)'
