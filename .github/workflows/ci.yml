name: CI

on:
  push:
    # Branch gate for the phase-2a delivery branch so pushes to it run the
    # same CI that main runs; pull_request below keeps PRs to main covered.
    branches: [main, codex/phase2a-websocket-e2e]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      # All Phase 2 tests below run offline: no model, no Tavily, no RAGFlow,
      # no host MySQL. Real-service smokes skip honestly unless their opt-in
      # env vars are set. Compose MySQL integration stays a documented
      # local/release gate (docker compose up -d mysql + idempotent bootstrap
      # of docker/mysql/init/010_tutorial.sql), not a CI service.
      - name: Run tests
        # Module execution (python -m) puts the checkout root on sys.path so
        # `app` and `examples` packages are importable; bare `pytest` only
        # adds tests/ and rootdir-relative entries.
        run: uv run python -m pytest tests/ -q
      - name: Lint
        run: uv run ruff check app examples tests scripts
      - name: Check formatting
        run: uv run ruff format --check app examples tests scripts
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
      - name: Validate Compose configuration
        run: docker compose config
      - name: Run offline environment doctor
        run: uv run python scripts/doctor.py --offline

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dir frontend
      # Node 22 release gate: install Playwright Chromium, then run the unit,
      # static, build and browser gates. Playwright uses deterministic in-test
      # HTTP/WebSocket fixtures and never starts the Phase 2 API.
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm --dir frontend exec vitest run
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Build
        run: pnpm --dir frontend build
      - name: Run Playwright browser tests
        run: pnpm --dir frontend exec playwright test
