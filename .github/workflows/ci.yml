name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Run tests
        run: uv run pytest tests/ -q
      - name: Lint
        run: uv run ruff check app tests benchmarks scripts
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
      - name: Run offline environment doctor
        run: uv run python scripts/doctor.py --offline
      - name: Check OpenAPI schema drift
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.check.json
          diff docs/openapi.json /tmp/openapi.check.json

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dir frontend
      - name: Run tests
        run: pnpm --dir frontend exec vitest run
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Build
        run: pnpm --dir frontend build
