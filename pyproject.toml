[project]
name = "deepsearch-agents"
version = "0.0.0"
description = "Agent Engineering Research Copilot — multi-agent trustworthy research system"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "deepagents>=0.6.12",
    "fastapi[standard]>=0.115,<1",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mysql-connector-python>=9.2,<10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/phase1/0*.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"
